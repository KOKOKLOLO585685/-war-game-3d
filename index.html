<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>War Fire 3D - Online</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; }
    #hud { position: fixed; top: 15px; left: 15px; color: #fff; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; z-index: 10; font-size: 1rem; }
    .controls { position: fixed; bottom: 25px; width: 100%; display: flex; justify-content: space-between; padding: 0 25px; box-sizing: border-box; pointer-events: none; z-index: 10; }
    .btn { width: 65px; height: 65px; border-radius: 50%; background: rgba(255,255,255,0.25); border: 2px solid #fff; color: #fff; font-weight: bold; pointer-events: auto; display: flex; align-items: center; justify-content: center; user-select: none; font-size: 1.2rem; }
    #fire-btn { background: rgba(239, 68, 68, 0.8); width: 75px; height: 75px; font-size: 1rem; }
  </style>
  <script src="https://cloudflare.com"></script>
  <script src="https://jsdelivr.net"></script>
</head>
<body>

  <div id="hud">الصحة: <b id="hp" style="color:#4ade80;">100</b> | النقاط: <b id="kills" style="color:#eab308;">0</b></div>

  <div class="controls">
    <div style="display:flex; gap:12px;">
      <div class="btn" id="left-btn">◀</div>
      <div class="btn" id="fwd-btn">▲</div>
      <div class="btn" id="right-btn">▶</div>
    </div>
    <div class="btn" id="fire-btn">إطلاق 🔥</div>
  </div>

  <script>
    const gun = Gun(['https://herokuapp.com']);
    const room = gun.get('war-fire-3d-room-v1');
    const myId = 'p_' + Math.random().toString(36).substr(2, 6);
    let myHp = 100, myKills = 0;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light = new THREE.DirectionalLight(0xffffff, 0.8);
    light.position.set(10, 25, 10);
    scene.add(light);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshStandardMaterial({ color: 0x2e6f40 }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function makePlayer(color) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.8, 0.6), new THREE.MeshStandardMaterial({ color }));
      body.position.y = 0.9;
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
      head.position.y = 2.1;
      const gunMesh = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 1.1), new THREE.MeshStandardMaterial({ color: 0x111111 }));
      gunMesh.position.set(0.45, 1.3, -0.5);
      g.add(body, head, gunMesh);
      return g;
    }

    const player = makePlayer(0x2563eb);
    scene.add(player);

    for (let i = 0; i < 20; i++) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(4, 5, 4), new THREE.MeshStandardMaterial({ color: 0x64748b }));
      b.position.set((Math.sin(i * 7) * 50), 2.5, (Math.cos(i * 13) * 50));
      scene.add(b);
    }

    const enemies = {};
    function broadcast() {
      room.get(myId).put({ x: player.position.x, z: player.position.z, ry: player.rotation.y, hp: myHp, t: Date.now() });
    }
    setInterval(broadcast, 150);

    room.map().on((data, id) => {
      if (id === myId || !data || Date.now() - data.t > 10000) return;
      if (!enemies[id]) {
        enemies[id] = makePlayer(0xef4444);
        scene.add(enemies[id]);
      }
      enemies[id].position.set(data.x, 0, data.z);
      enemies[id].rotation.y = data.ry;
    });

    const keys = { fwd: false, left: false, right: false };
    const bullets = [];
    const bind = (id, k) => {
      const el = document.getElementById(id);
      el.ontouchstart = el.onmousedown = (e) => { e.preventDefault(); keys[k] = true; };
      el.ontouchend = el.onmouseup = () => keys[k] = false;
    };
    bind("fwd-btn", "fwd"); bind("left-btn", "left"); bind("right-btn", "right");

    document.getElementById("fire-btn").onclick = () => {
      const b = new THREE.Mesh(new THREE.SphereGeometry(0.18), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
      b.position.copy(player.position).add(new THREE.Vector3(0, 1.3, 0));
      b.rotation.copy(player.rotation);
      scene.add(b);
      bullets.push(b);
    };

    function animate() {
      requestAnimationFrame(animate);
      if (keys.left) player.rotation.y += 0.05;
      if (keys.right) player.rotation.y -= 0.05;
      if (keys.fwd) player.translateZ(-0.25);

      bullets.forEach((b, i) => {
        b.translateZ(-1.0);
        Object.keys(enemies).forEach(id => {
          if (b.position.distanceTo(enemies[id].position.clone().add(new THREE.Vector3(0, 1, 0))) < 1.2) {
            myKills++;
            document.getElementById("kills").textContent = myKills;
            scene.remove(b);
            bullets.splice(i, 1);
          }
        });
        if (b.position.distanceTo(player.position) > 80) { scene.remove(b); bullets.splice(i, 1); }
      });

      const camPos = new THREE.Vector3(0, 3.2, 5.5).applyMatrix4(player.matrixWorld);
      camera.position.lerp(camPos, 0.15);
      camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
